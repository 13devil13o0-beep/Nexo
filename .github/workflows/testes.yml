# Corre a suite de testes a cada alteração.
#
# Existe por uma razão concreta: três avarias no empacotamento do .exe
# passaram despercebidas durante commits a fio, porque ninguém corria esse
# caminho. O que não é executado automaticamente apodrece em silêncio.

name: Testes

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  testes:
    name: Testes (${{ matrix.os }})
    runs-on: ${{ matrix.os }}

    strategy:
      fail-fast: false
      matrix:
        # Windows: onde o NEXO é usado como aplicação de secretária.
        # Linux: o alvo do uso sem ecrã — servidores, automação, o hardware
        # dos drones.
        #
        # O Linux entrou aqui a não bloquear, por não estar verificado. Bem
        # visto: a primeira execução acusou logo uma falha. Só que o job
        # aparecia VERDE à mesma — o continue-on-error esconde o resultado e
        # obriga a ler os registos para saber a verdade, o que ninguém faz.
        # Corrigida a falha (era o whitelist de caminhos a comparar texto em
        # vez de pastas), os dois passam e os dois passam a bloquear.
        os: [windows-latest, ubuntu-latest]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      # npm install e não npm ci: este projecto não versiona o package-lock.
      - name: Instalar dependências
        run: npm install

      - name: Correr testes
        run: npm test
